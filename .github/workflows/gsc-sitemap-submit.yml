name: Submit sitemap to Google Search Console

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gsc-sitemap-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate service account
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          create_credentials_file: true

      - name: Wait for the production deployment
        run: sleep 90

      - name: Submit and verify the canonical sitemap
        env:
          SITE_URL: https://wonon.ehon365.kr/
          SITEMAP_URL: https://wonon.ehon365.kr/sitemap.xml
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-api-python-client google-auth
          python3 <<'PY'
          import os
          import time
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          site = os.environ['SITE_URL']
          sitemap = os.environ['SITEMAP_URL']
          credentials = service_account.Credentials.from_service_account_file(
              os.environ['GOOGLE_APPLICATION_CREDENTIALS'],
              scopes=['https://www.googleapis.com/auth/webmasters'],
          )
          service = build('searchconsole', 'v1', credentials=credentials, cache_discovery=False)
          service.sitemaps().submit(siteUrl=site, feedpath=sitemap).execute()
          for _ in range(12):
              item = service.sitemaps().get(siteUrl=site, feedpath=sitemap).execute()
              if not item.get('isPending'):
                  assert int(item.get('errors', 0)) == 0, item
                  assert int(item.get('warnings', 0)) == 0, item
                  assert item.get('lastDownloaded'), item
                  print('GSC sitemap verified: downloaded with zero errors and warnings')
                  break
              time.sleep(20)
          else:
              raise SystemExit('GSC did not finish processing within the verification window.')
          PY
